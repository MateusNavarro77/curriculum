# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.6/schema.json
cv:
  name: "Mateus Navarro"
  headline: "Desenvolvedor"
  location: "Fortaleza, CE"
  email: "mateusnavarro9@gmail.com"
  phone: "+55 85 98922-5633"
  social_networks:
    - network: "GitHub"
      username: "MateusNavarro77"
  sections:
    perfil_profissional:
      - "Desenvolvedor de software com foco em desenvolvimento mobile utilizando
        Flutter e Dart. Experiência na criação de interfaces de usuário,
        desenvolvimento de componentes reutilizáveis, integração com APIs
        RESTful e gerenciamento de estado com BLoC e Cubit. Atuação em ambiente
        corporativo, colaborando com equipes multidisciplinares e utilizando
        ferramentas de CI/CD para automação de testes, build e deploy.
        Experiência adicional em blockchain, com desenvolvimento de smart
        contracts em Solidity, utilização da biblioteca OpenZeppelin,
        implementação de padrões ERC20, ERC721 e ERC1155 e realização de testes
        unitários e de integração com Hardhat e Truffle."
    experiência:
      - company: "Banco do Nordeste"
        position: "Bolsista de Desenvolvimento de Software (Flutter)"
        location: "Fortaleza, CE"
        start_date: "2024-11"
        end_date: "present"
        highlights:
          - "Implementei em código (Dart/Flutter) componentes de interface do
            usuário projetados no Figma para a construção de uma biblioteca de
            componentes reutilizáveis em Flutter. Esses componentes foram
            integrados em diversos projetos internos do banco, melhorando a
            consistência visual e a eficiência no desenvolvimento."
          - "Colaborei com equipes multifuncionais, incluindo designers e
            desenvolvedores, para garantir que os componentes atendessem aos
            requisitos de usabilidade, desempenho e acessibilidade."
          - "Utilizei a ferramenta de CI/CD Jenkins para automatizar o processo
            de teste, build e deploy de Provas de Conceito (PoCs) desenvolvidas
            em Flutter, garantindo entregas mais rápidas e confiáveis."
          - "Realizei manutenção e atualizações em uma plataforma interna de
            documentação que utilizava Docusaurus, assegurando que a
            documentação técnica estivesse sempre atualizada e acessível para os
            desenvolvedores."
      - company: "2nd Market"
        position: "Desenvolvedor Web Blockchain"
        start_date: "2022-08"
        end_date: "2024-05"
        highlights:
          - "Atuação no desenvolvimento na área de blockchain, criando soluções
            em smart contracts para empresas."
          - "Utilização de bibliotecas profissionais de smart contracts, como a
            OpenZeppelin."
          - "Realização de testes unitários e de integração dos smart contracts,
            garantindo a qualidade do código desenvolvido."
          - "Utilização de frameworks e bibliotecas como Hardhat e Truffle."
          - "Realizei deploys de smart contracts em redes de teste (Fantom
            testnet, Sepolia) e em redes principais (Polygon)."
    formação_acadêmica:
      - institution: "Universidade de Fortaleza (UNIFOR)"
        area: "Engenharia de Computação"
        degree: "Graduando"
        start_date: "2022"
        end_date: "present"
        highlights:
          - "Atualmente no 7º semestre do curso."
          - "Conclusão das disciplinas de Estrutura de Dados com Java,
            Programação Orientada a Objetos com Java e Algoritmos."
    habilidades:
      - label: "Linguagens em geral"
        details: "Dart, Solidity, JavaScript, TypeScript e Java"
      - label: "Blockchain e Smart Contracts"
        details: "Padrões (ERC20, ERC721, ERC1155), OpenZeppelin, Hardhat, Truffle,
          Polygon, Ethereum"
      - label: "Desenvolvimento mobile (Flutter)"
        details: "Gerenciamento de estado com o padrão BLoC/Cubit, integração com APIs
          RESTful, armazenamento local com SQLite e Shared Preferences"
      - label: "Ferramentas"
        details: "Git, Gitlab, Github, Jenkins, Figma, IBM RTC, Docusaurus"
    idiomas:
      - label: "Português"
        details: "Nativo"
      - label: "Inglês"
        details: "Intermediário"

design:
  theme: engineeringclassic
  page:
    size: us-letter
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 79, 144)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: Raleway
      name: Raleway
      headline: Raleway
      connections: Raleway
      section_titles: Raleway
    font_size:
      body: 10pt
      name: 30pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.7cm
    space_below_headline: 0.7cm
    space_below_connections: 0.7cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.5cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
    space_between_text_based_entries: 0.3em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.12cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0cm
      space_above: 0.12cm
      space_between_items: 0.12cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** -- **LOCATION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY -- LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE


locale:
  language: "portuguese"
  month_abbreviations:
