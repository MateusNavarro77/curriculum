    - "Mar"
    - "Abr"
    - "Mai"
    - "Jun"
    - "Jul"
    - "Ago"
    - "Set"
    - "Out"
    - "Nov"
    - "Dez"
  month_names:
    - "Janeiro"
    - "Fevereiro"
    - "Março"
    - "Abril"
    - "Maio"
    - "Junho"
    - "Julho"
    - "Agosto"
    - "Setembro"
    - "Outubro"
    - "Novembro"
    - "Dezembro"

settings:
  render_command:
    pdf_path: "rendercv_output/Mateus_Navarro_CV_PT.pdf"
